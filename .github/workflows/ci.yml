name: CI

# The fast gate: everything that can be checked without building an installer.
# Building is release.yml's job -- scripts/release.py pushes the branch and the
# tag atomically, so both workflows fire on the same tree and building here
# would mean two concurrent twelve-minute Windows builds of an identical commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Fast gate
    # Windows, not Ubuntu: pywin32 has no Linux wheel and panel/hotkey.py is
    # ctypes against user32. Nothing here can be cross-tested.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter the app is built and shipped with.
          python-version: '3.12'
          # PySide6-Essentials + Addons is ~250 MB. Restoring it from the
          # Actions cache is appreciably faster than PyPI.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Version is well formed
        run: python scripts/check_version.py

      - name: Byte-compile everything
        run: python -m compileall -q panel stashlib scripts

      - name: stashlib must not import Qt
        shell: pwsh
        run: |
          # stashlib/__init__.py states the rule; this enforces it. Importing
          # every submodule and then checking sys.modules catches a Qt import
          # hidden inside a function body, which grep would miss.
          @'
          import importlib, pkgutil, sys
          import stashlib
          for module in pkgutil.iter_modules(stashlib.__path__, "stashlib."):
              importlib.import_module(module.name)
          leaked = sorted(n for n in sys.modules if n.split(".")[0] in {"PySide6", "shiboken6"})
          if leaked:
              print("stashlib pulled in Qt:", leaked)
              raise SystemExit(1)
          print("clean:", len(sys.modules), "modules, no Qt")
          '@ | python -

      - name: Golden corpus
        run: python -m stashlib.normalize

      - name: Panel imports
        env:
          # No display on the runner. Importing does not need one, but this
          # keeps the step honest if a module ever builds a widget at import.
          QT_QPA_PLATFORM: offscreen
        run: python -c "import panel.app, panel.debug, panel.delegate, panel.filters, panel.hotkey, panel.model, panel.preview, panel.results_view, panel.roots_dialog, panel.selftest, panel.theme, panel.thumb_loader, panel.workers; print('ok')"

      - name: Selftest from source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m panel --selftest
